site_name: Output Module
site_author: idyllm
site_url: https://idyllm.github.io
repo_url: https://github.com/xdylanm/modular-output

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.tabs
  font:
    text: Radio Canada
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: 
        icon: bootstrap-icons-1.13.1/toggle-off
        name: Switch to dark mode
      primary: black
      accent: grey 
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: 
        icon: bootstrap-icons-1.13.1/toggle-on
        name: Switch to light mode
      primary: blue grey
      accent: indigo
  icon:
    logo: bootstrap-icons-1.13.1/boombox

plugins:
  - search
  - include-markdown
  - mkdocs-jupyter

markdown_extensions: 
  - pymdownx.arithmatex
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options: 
        custom_icons:
          - overrides/.icons

nav:
  - Home: index.md
  - Design: theory.md 
  - Assembly: assembly.md
  - Schematic: assets/schematic.pdf
  
extra_javascript:
  - scripts/arithmatex-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/idyllm

exclude_docs: | 
  /assets/bom.md

copyright: Copyright &copy; 2025-2026 idyllm